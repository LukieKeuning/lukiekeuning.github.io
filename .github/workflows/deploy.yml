name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test static export
        run: |
          export SITE_BASE_PATH=$(node --experimental-strip-types --input-type=module -e 'import {resolveBasePath} from "./src/lib/paths.ts"; console.log(resolveBasePath(process.env.GITHUB_REPOSITORY))')
          npm run test:e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
